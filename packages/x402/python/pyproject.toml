[project]
name = "libertai-x402"
version = "0.2.0"
description = "x402 utils to use LibertAI services"
authors = [{ name = "LibertAI.io team", email = "hello@libertai.io" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["x402[evm,httpx]>=2.29.0", "httpx>=0.28.1"]

[project.urls]
Homepage = "https://libertai.io"
Repository = "https://github.com/LibertAI/libertai-agents"

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.0"
ruff = "^0.6.0"
pytest = "^9"
pytest-asyncio = "^1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
